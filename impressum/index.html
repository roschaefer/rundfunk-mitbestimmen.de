<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Impressum | Rundfunk mitbestimmen</title>
    <meta name="description" content="Impressum von rundfunk-mitbestimmen.de.">
    <style>
      :root {
        color-scheme: light;
        --ink: #1b2430;
        --muted: #52616f;
        --paper: #f7f4ee;
        --line: #d9d2c3;
        --accent: #0f766e;
        --accent-dark: #115e59;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.55;
        color: var(--ink);
        background: var(--paper);
      }

      a {
        color: var(--accent-dark);
        text-underline-offset: 0.18em;
      }

      header,
      main,
      footer {
        width: min(880px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        padding: 28px 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0;
        text-decoration: none;
        color: var(--ink);
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: #ffffff;
        background: var(--accent);
        font-weight: 900;
      }

      nav {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        font-size: 0.95rem;
      }

      main {
        padding: 54px 0 70px;
      }

      .kicker {
        margin: 0 0 14px;
        color: var(--accent-dark);
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0 0 32px;
        font-size: clamp(2.4rem, 5vw, 4.8rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      section {
        padding-top: 24px;
        border-top: 2px solid var(--line);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 1.18rem;
      }

      p,
      address {
        margin: 0;
        color: var(--muted);
      }

      address {
        font-style: normal;
      }

      p + p,
      address + p {
        margin-top: 14px;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        padding: 26px 0 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="../" aria-label="Rundfunk mitbestimmen">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Rundfunk mitbestimmen</span>
      </a>
      <nav aria-label="Rechtliches und Projektlinks">
        <a href="../">Startseite</a>
        <a href="../datenschutz/">Datenschutz</a>
        <a href="https://github.com/roschaefer/rundfunk-mitbestimmen">Quellcode</a>
      </nav>
    </header>

    <main>
      <p class="kicker">Rechtliches</p>
      <h1>Impressum</h1>

      <section>
        <h2>Anbieter</h2>
        <address>
          Robert Schäfer<br>
          Unterdorfstrasse 5<br>
          53797 Lohmar<br>
          Deutschland
        </address>
        <p>
          E-Mail:
          <a href="mailto:kontakt@rundfunk-mitbestimmen.de">kontakt@rundfunk-mitbestimmen.de</a>
        </p>
      </section>
    </main>

    <footer>
      <span>Rundfunk mitbestimmen ist nicht mehr als Dienst aktiv.</span>
      <span><a href="../datenschutz/">Datenschutz</a></span>
    </footer>
    <script
      data-goatcounter="https://rundfunk-mitbestimmen.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
